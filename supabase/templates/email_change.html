<h2>Confirm your new email</h2>
<p>Follow this link to confirm the change of your TJS account's email from {{ .Email }} to {{ .NewEmail }}:</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email_change">Confirm the change</a></p>
<p>If you did not ask for this change, ignore this email: your address stays as it is.</p>
