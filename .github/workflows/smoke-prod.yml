# The production smoke suite (e2e/smoke-prod/, #31) against a deployment the person running it names: the
# home, the shop, a product, search, a guest cart, the sign-in page, robots and the sitemap, the share image
# and the security headers. It orders nothing and signs nobody in, so it is safe on production; the only writes
# are the guest cart's cookie and the cart's rate-limit counter rows (consume_rate_limit). Started by hand (Actions → Production smoke → Run workflow); no secret is used.

name: Production smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "The deployment to check, e.g. https://tjs-next.vercel.app"
        required: true
        default: "https://tjs-next.vercel.app"

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        env:
          # an input, passed through the environment (never interpolated into the script)
          E2E_BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test -c e2e/smoke-prod/playwright.config.ts

      - name: Upload the traces
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
