# The merge gate. One required job, `ci`: every pull request and every push to main proves migration
# versions (PRs), lint, types, unit tests, the production build, the database (migrations + pgTAP on a
# real local Supabase stack) and the Playwright e2e flows against the built app on that stack.
# Runs PR code with the read-only GITHUB_TOKEN only; no secret is used here. See docs/ci.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One group per PR and one per pushed ref: a fork PR from a branch named main never shares a group
  # with the push-to-main runs.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # The e2e step serves the built app (`next start`) on this port instead of `next dev`.
      E2E_SERVER: start
      E2E_PORT: "3000"
      # The /ui-kit showcase the shell e2e tests use; on for the build and e2e here, unset on Vercel (404).
      TJS_UI_KIT: "true"
      # The local stack of supabase/config.toml ([api] port) and the CLI's fixed public demo anon key, not
      # secrets. Next inlines NEXT_PUBLIC_* at build time, before the stack starts; the step after
      # `supabase start` fails if the stack reports other values.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:40901
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:migrations compares with the base branch and the merge base: full history on PRs.
          # (a string: a number 0 is falsy in an expression and would fall through to 1)
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check migration versions
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run check:migrations -- --pr "$PR_NUMBER"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Start the local Supabase stack
        # Only what the app and the tests use: Postgres, Auth, REST, Storage, Kong, Mailpit.
        run: npx supabase start -x studio,postgres-meta,imgproxy,edge-runtime,logflare,vector,realtime,supavisor

      - name: Reset the database (every migration, then the seed)
        run: npm run db:reset

      - name: Database tests (pgTAP)
        run: npm run test:db

      - name: Write the stack's values to .env.local
        # The names the app reads, by the same mapping as `npm run supabase:start:worktree` (public CLI demo keys).
        run: pwsh -NoProfile -File scripts/ci/Write-StackEnv.ps1

      - name: Integration tests (local stack)
        # The *.integration.test.ts files skip in the unit step (no stack yet) and run here against the stack;
        # REQUIRE_LOCAL_STACK=1 turns a missing stack into a failure instead of a silent skip.
        env:
          REQUIRE_LOCAL_STACK: "1"
        run: npm run test:integration

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (built app on the local stack)
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the Playwright traces
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
