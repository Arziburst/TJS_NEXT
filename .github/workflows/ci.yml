# The merge gate. One required job, `ci`: every pull request and every push to main proves migration
# versions (PRs), lint, types, unit tests, the production build, the database (migrations + pgTAP on a
# real local Supabase stack) and the Playwright e2e flows against the built app on that stack.
# Runs PR code with the read-only GITHUB_TOKEN only; no secret is used here. See docs/ci.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # The e2e step serves the built app (`next start`) on this port instead of `next dev`.
      E2E_SERVER: start
      E2E_PORT: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:migrations compares with the base branch and the merge base: full history on PRs.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check migration versions
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run check:migrations -- --pr "$PR_NUMBER"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Start the local Supabase stack
        # Only what the app and the tests use: Postgres, Auth, REST, Storage, Kong, Mailpit.
        run: npx supabase start -x studio,postgres-meta,imgproxy,edge-runtime,logflare,vector,realtime,supavisor

      - name: Reset the database (every migration, then the seed)
        run: npm run db:reset

      - name: Database tests (pgTAP)
        run: npm run test:db

      - name: Write the stack's values to .env.local
        # The same values `npm run supabase:start:worktree` writes locally (public CLI demo keys).
        run: npx supabase status -o env > .env.local

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (built app on the local stack)
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the Playwright traces
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
